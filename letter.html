<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Letter</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: #89b4fa;          
            font-family: sans-serif;
            text-align: center;
            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .letter {
            width: min(90vw, 640px);
            min-height: 80vh;
            box-sizing: border-box;
            padding: 40px;
            background-color: #b4d0fc;
            color: #1e1e2e;
            border-radius: 0;
            text-align: left;
        }
        .confetti {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 1;
        }
        .confetti-piece {
            position: absolute;
            top: -12px;
            left: var(--left);
            width: var(--width);
            height: var(--height);
            background-color: var(--color);
            animation: confetti-fall var(--duration) linear var(--delay) forwards;
        }
        @keyframes confetti-fall {
            to {
                transform: translate3d(var(--drift), 105vh, 0) rotate(var(--rotation));
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="confetti" aria-hidden="true"></div>
    <main class="letter">
        <h1>Happy birthday!</h1>
        <p> I can't believe that you're turning __ already! </p>
    </main>
    <script>
        if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
            const confetti = document.querySelector(".confetti");
            const colors = ["#f38ba8", "#fab387", "#f9e2af", "#a6e3a1", "#89b4fa", "#cba6f7"];

            for (let i = 0; i < 80; i++) {
                const piece = document.createElement("span");
                piece.className = "confetti-piece";
                piece.style.setProperty("--left", `${Math.random() * 100}vw`);
                piece.style.setProperty("--width", `${5 + Math.random() * 7}px`);
                piece.style.setProperty("--height", `${8 + Math.random() * 10}px`);
                piece.style.setProperty("--color", colors[Math.floor(Math.random() * colors.length)]);
                piece.style.setProperty("--duration", `${3 + Math.random() * 3}s`);
                piece.style.setProperty("--delay", `${-Math.random() * 2}s`);
                piece.style.setProperty("--drift", `${(Math.random() - 0.5) * 180}px`);
                piece.style.setProperty("--rotation", `${Math.random() * 720}deg`);
                confetti.append(piece);
            }
        }
    </script>
</body>
</html>
