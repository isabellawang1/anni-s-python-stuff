<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Letter</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: #89b4fa;          
            font-family: sans-serif;
            text-align: center;
            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .letter {
            width: min(90vw, 640px);
            min-height: 80vh;
            box-sizing: border-box;
            padding: 40px;
            background-color: #b4d0fc;
            color: #1e1e2e;
            border-radius: 0;
            text-align: left;
        }
    </style>
</head>
<body>
    <main class="letter">
        <h1>Happy birthday!</h1>
        <p> I can't believe that you're turning __ already! </p>
    </main>
</body>
</html>
