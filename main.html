<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Happy Birthday</title>
    <style>
        body {
            background-color: #1e1e2e;
            color: #89b4fa;          
            font-family: sans-serif;
            text-align: center;
            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .envelope {
            position: relative;
            display: grid;
            place-items: center;
            width: 280px;
            height: 180px;
            background: #89b4fa;
            color: #1e1e2e;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .envelope::before {
            content: "";
            position: absolute;
            inset: 0;
            background: #b4d0fc;
            clip-path: polygon(0 0, 100% 0, 50% 58%);
            border-radius: 6px 6px 0 0;
        }
        .envelope span {
            position: relative;
            margin-top: 48px;
        }
    </style>
</head>
<body>
    <a class="envelope" href="letter.html" aria-label="Open your letter">
        <span>Open your letter</span>
    </a>
</body>
</html>
